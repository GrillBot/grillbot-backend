    ports:
      - "3018:5045"

  points_service:
    <<: *service
    image: ghcr.io/grillbot/grillbot.services:points_service
    build:
      context: ..
      dockerfile: docker/dotnet-service.Dockerfile
      args:
        PROJECT: src/Services/PointsService
        ASSEMBLY: PointsService.dll
        PORT: 5258
    environment:
      <<: *environment
      ConnectionStrings__Default: Host=${DB_HOST:-host.docker.internal};Port=${DB_PORT:-5432};Database=PointsService;Username=${DB_USERNAME:-grillbot};Password=${DB_PASSWORD:-}
    ports:
      - "3009:5258"

  remind_service:
    <<: *service
    image: ghcr.io/grillbot/grillbot.services:remind_service
    build:
      context: ..
      dockerfile: docker/dotnet-service.Dockerfile
      args:
        PROJECT: src/Services/RemindService
        ASSEMBLY: RemindService.dll
        PORT: 5212
    environment:
      <<: *environment
      ConnectionStrings__Default: Host=${DB_HOST:-host.docker.internal};Port=${DB_PORT:-5432};Database=RemindService;Username=${DB_USERNAME:-grillbot};Password=${DB_PASSWORD:-}
    ports:
      - "3014:5212"

  rubbergod_service:
    <<: *service
    image: ghcr.io/grillbot/grillbot.services:rubbergod_service
    build:
      context: ..
      dockerfile: docker/dotnet-service.Dockerfile
      args:
        PROJECT: src/Services/RubbergodService
        ASSEMBLY: RubbergodService.dll
        PORT: 5031
    environment:
      <<: *environment
      ConnectionStrings__Default: Host=${DB_HOST:-host.docker.internal};Port=${DB_PORT:-5432};Database=RubbergodService;Username=${DB_USERNAME:-grillbot};Password=${DB_PASSWORD:-}
      ConnectionStrings__BotToken: ${DISCORD_BOT_TOKEN:-}
      DirectApi__Rubbergod__ChannelId: ${RUBBERGOD_CHANNEL_ID:-942801245486321705}
      Redis__Endpoint: redis-ephemeral:6379
      Redis__Password: ${REDIS_PASSWORD:-grillbot}
    ports:
      - "3006:5031"

  searching_service:
    <<: *service
    image: ghcr.io/grillbot/grillbot.services:searching_service
    build:
      context: ..
      dockerfile: docker/dotnet-service.Dockerfile
      args:
        PROJECT: src/Services/SearchingService
        ASSEMBLY: SearchingService.dll
        PORT: 5164
    environment:
      <<: *environment
      ConnectionStrings__Default: Host=${DB_HOST:-host.docker.internal};Port=${DB_PORT:-5432};Database=SearchingService;Username=${DB_USERNAME:-grillbot};Password=${DB_PASSWORD:-}
    ports:
      - "3015:5164"

  unverify_service:
    <<: *service
    image: ghcr.io/grillbot/grillbot.services:unverify_service
    build:
      context: ..
      dockerfile: docker/dotnet-service.Dockerfile
      args:
        PROJECT: src/Services/UnverifyService
        ASSEMBLY: UnverifyService.dll
        PORT: 5037
    environment:
      <<: *environment
      ConnectionStrings__Default: Host=${DB_HOST:-host.docker.internal};Port=${DB_PORT:-5432};Database=UnverifyService;Username=${DB_USERNAME:-grillbot};Password=${DB_PASSWORD:-}
      ConnectionStrings__BotToken: ${DISCORD_BOT_TOKEN:-}
