  user_management_service:
    <<: *service
    image: ghcr.io/grillbot/grillbot.services:user_management_service
    build:
      context: ..
      dockerfile: docker/dotnet-service.Dockerfile
      args:
        PROJECT: src/Services/UserManagementService
        ASSEMBLY: UserManagementService.dll
        PORT: 5052
    environment:
      <<: *environment
      ConnectionStrings__Default: Host=${DB_HOST:-host.docker.internal};Port=${DB_PORT:-5432};Database=UserManagementService;Username=${DB_USERNAME:-grillbot};Password=${DB_PASSWORD:-}
